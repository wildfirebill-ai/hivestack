# Security scan — scan the repo (secrets + dependency vulnerabilities) and the
# Docker image (Trivy), then aggregate every finding into `vulnerabilities.md`.
#
# Run on push/PR, weekly, and on demand. Writes vulnerabilities.md and uploads it
# as a workflow artifact so it can be downloaded/reviewed.
#
# Actions pinned to current, Node-24-compatible releases (Node 20 runner image is
# deprecated as of 2025-09-19).
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, Mondays 03:00 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_REF: "hivestack:scan" # locally loaded (not pushed)

jobs:
  scan:
    name: Repo + image vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # ---- repo: leaked secrets ------------------------------------------
      # Run the OSS gitleaks CLI directly (not gitleaks-action) so this works on
      # org repos without a commercial license and writes a deterministic JSON
      # report we can aggregate.
      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b "${RUNNER_TEMP}/bin" v8.24.0
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Scan repo for secrets (gitleaks)
        continue-on-error: true # report only; fail on findings in vulnerabilities.md
        run: |
          mkdir -p reports
          gitleaks git --source "$GITHUB_WORKSPACE" \
            --report-format=json --report-path=reports/gitleaks.json \
            --redact --exit-code=0 || true
          test -f reports/gitleaks.json || echo "{}" > reports/gitleaks.json
          wc -c reports/gitleaks.json

      # ---- repo: python package vulnerabilities ---------------------------
      - name: Scan Python deps (pip-audit)
        if: always()
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt -f json --ignore-vulns "" > reports/pip-audit.json 2>/dev/null \
            || pip-audit -r backend/requirements.txt -f json > reports/pip-audit.json 2>/dev/null || echo "{}" > reports/pip-audit.json
        continue-on-error: true

      # ---- repo: javascript dependency vulnerabilities ---------------------
      - name: Scan JS deps (npm audit)
        if: always()
        working-directory: web
        run: |
          npm audit --json > ../reports/npm-audit.json 2>/dev/null || echo "{}" > ../reports/npm-audit.json
        continue-on-error: true

      # ---- docker image: Trivy scan ----------------------------------------
      - name: Set up Buildx
        if: always()
        uses: docker/setup-buildx-action@v4

      - name: Build image (load, no push)
        if: always()
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: reports/trivy-image.json
          exit-code: "0"
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      # ---- aggregate -> vulnerabilities.md ---------------------------------
      - name: Write vulnerabilities.md
        if: always()
        run: |
          python .github/scripts/aggregate_vulns.py reports > vulnerabilities.md

      - name: Show summary
        if: always()
        run: |
          echo "## Security scan" >> "$GITHUB_STEP_SUMMARY"
          cat vulnerabilities.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload vulnerabilities.md + reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan
          path: |
            vulnerabilities.md
            reports/
