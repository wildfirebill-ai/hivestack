# Release — build & push the hivestack image to GitHub Container Registry (GHCR).
#
# Triggers:
#   - pushing a version tag (v0.1.0, ...) -> pushes ghcr.io/wildfirebill-ai/hivestack:<tag> and :latest
#   - manual "Run workflow" with a version input -> same, for pre-release testing
#
# Actions pinned to current, Node-24-compatible releases (the Node 20 runner image
# is deprecated as of 2025-09-19 — see GitHub's runner deprecation changelog).
name: Release (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag (e.g. 0.1.0) — also pushed as :latest"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # wildfirebill-ai/hivestack

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ github.event.inputs.version }}"
          else
            # strip the leading "v" from the tag name (v0.1.0 -> 0.1.0)
            V="${GITHUB_REF_NAME#v}"
          fi
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          if [[ "$V" != "$FILE_V" ]]; then
            echo "::warning::Tag/dispatch version '$V' does not match VERSION file '$FILE_V'"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Summary
        shell: bash
        run: |
          echo "## Released :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\` and \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
